name: CI

on: [push, pull_request]

env:
  CI: true # disables SBT super shell which has problems with CI environments

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup up JDK
        id: setup-java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Update dependencies
        if: steps.setup-java.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Compile and check format
        run: >-
          sbt "Test/compile; scalafmtSbt" &&
          git diff --exit-code

      - name: Run tests
        run: sbt -Dsbt.color=always "testFull"

      - name: Check mdoc for uncommitted changes
        run: sbt -Dsbt.color=always "docs/mdoc --check"

      - name: Compile API documentation
        run: sbt -Dsbt.color=always "doc"

      - name: Publish locally
        run: sbt -Dsbt.color=always "publishLocal"

  validate-changelog:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Validate Changelog formatting
        run: npx zx --install .github/workflows/scripts/validate_changelog.mjs
